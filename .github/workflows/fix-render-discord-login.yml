name: Fix Render Discord Login Diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-render-discord-login.yml'

permissions:
  contents: write

jobs:
  patch-login:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Patch Discord login diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.js')
          text = path.read_text(encoding='utf-8')

          old = 'client.login(BOT_TOKEN);'
          new = '''console.log('🔄 Attempting to login to Discord...');
          console.log(`🔑 BOT_TOKEN loaded: ${BOT_TOKEN ? 'YES' : 'NO'}`);
          console.log(`🔑 BOT_TOKEN length: ${BOT_TOKEN.length}`);

          client.login(BOT_TOKEN)
              .then(() => {
                  console.log('✅ Discord login request accepted. Waiting for READY event...');
              })
              .catch((error) => {
                  console.error('❌ Discord login failed!');
                  console.error('Error name:', error?.name || 'Unknown');
                  console.error('Error message:', error?.message || String(error));
                  console.error(error);
                  process.exit(1);
              });

          client.on('ready', () => {
              console.log(`🟢 BOT ONLINE: ${client.user.tag}`);
              console.log(`🆔 Bot ID: ${client.user.id}`);
              console.log(`🏠 Servers: ${client.guilds.cache.size}`);
          });

          client.on('error', (error) => {
              console.error('❌ Discord Client Error:', error);
          });

          process.on('unhandledRejection', (error) => {
              console.error('❌ Unhandled Promise Rejection:', error);
          });

          process.on('uncaughtException', (error) => {
              console.error('❌ Uncaught Exception:', error);
          });'''

          if old not in text:
              print('Login line already patched or not found; no changes made.')
          else:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('index.js login diagnostics patched successfully.')
          PY

      - name: Commit patched index.js
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.js
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'fix: add Discord Render login diagnostics'
          git push
