name: Fix Discord Login Now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-discord-login-now.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch index.js login block
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.js')
          text = path.read_text(encoding='utf-8')

          marker = "console.log('🔄 Attempting to login to Discord...');"
          start = text.rfind(marker)
          if start < 0:
              raise SystemExit('Could not find Discord login block')

          new_block = r'''console.log('🔄 Attempting to login to Discord...');
          console.log(`🔑 BOT_TOKEN loaded: ${BOT_TOKEN ? 'YES' : 'NO'}`);
          console.log(`🔑 BOT_TOKEN length: ${BOT_TOKEN.length}`);
          console.log('🌐 Starting Discord Gateway connection...');

          let discordReady = false;
          const loginStartedAt = Date.now();

          client.once('ready', () => {
              discordReady = true;
              console.log(`🟢 BOT ONLINE: ${client.user.tag}`);
              console.log(`🆔 Bot ID: ${client.user.id}`);
              console.log(`🏠 Servers: ${client.guilds.cache.size}`);
              console.log(`⏱️ Discord login/READY time: ${Date.now() - loginStartedAt}ms`);
          });

          client.on('error', (error) => {
              console.error('❌ Discord Client Error:', error);
              console.error('Error name:', error?.name || 'Unknown');
              console.error('Error message:', error?.message || String(error));
          });

          process.on('unhandledRejection', (error) => {
              console.error('❌ Unhandled Promise Rejection:', error);
          });

          process.on('uncaughtException', (error) => {
              console.error('❌ Uncaught Exception:', error);
          });

          const loginTimeout = setTimeout(() => {
              if (discordReady) return;
              console.error('❌ Discord login timeout: no READY event received within 30 seconds.');
              console.error('🔎 Check Render Environment Variables: BOT_TOKEN must contain the current Discord Bot Token.');
              console.error('🔎 Also check Discord Developer Portal: Bot is enabled and the token has not been reset.');
              process.exit(1);
          }, 30000);

          client.login(BOT_TOKEN)
              .then(() => {
                  console.log('✅ Discord login request accepted; waiting for READY event...');
              })
              .catch((error) => {
                  clearTimeout(loginTimeout);
                  console.error('❌ Discord login failed!');
                  console.error('Error name:', error?.name || 'Unknown');
                  console.error('Error message:', error?.message || String(error));
                  console.error(error);
                  process.exit(1);
              });'''

          # Replace everything from the final login marker to EOF.
          path.write_text(text[:start] + new_block + '\n', encoding='utf-8')
          print('index.js Discord login block patched successfully.')
          PY

      - name: Validate JavaScript syntax
        run: node --check index.js

      - name: Commit index.js
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.js
          git commit -m 'fix: prevent Discord login from hanging on Render' || echo 'No changes to commit.'
          git push