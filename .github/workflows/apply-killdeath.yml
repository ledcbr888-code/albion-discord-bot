name: Apply AlbionKB Kill Death Renderer
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'Apply AlbionKB kill/death renderer') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.js
        run: |
          node <<'NODE'
          const fs = require('fs');
          let s = fs.readFileSync('index.js','utf8');
          const patch = fs.readFileSync('killdeath_patch.txt','utf8').trimEnd()+'\n';
          const a=s.indexOf('async function generateKillDeathCardImage('), b=s.indexOf('\nfunction extractMatchId(',a);
          if(a<0||b<0) throw new Error('renderer block not found');
          s=s.slice(0,a)+patch+s.slice(b+1);
          const reKill=/const eventPayload = \{ killerName, killerGuild, victimName, victimGuild, totalFame, eventTime \};\s+const mainCard = await generateKillDeathCardImage\(eventPayload, false\);[\s\S]*?files: \[mainCard\]/;
          const reDeath=/const eventPayload = \{ killerName, killerGuild, victimName, victimGuild, totalFame, eventTime \};\s+const mainCard = await generateKillDeathCardImage\(eventPayload, true\);[\s\S]*?files: \[mainCard\]/;
          s=s.replace(reKill,`const eventPayload = { killerName, killerGuild, victimName, victimGuild, totalFame, eventTime, eventId };\n                    const cards = await buildKillDeathImages(eventPayload, false);\n                    \n                    await channel.send({\n                        content: \`🎯 **Kill Alert!** **\${killerName}** (\${killerGuild || 'No Guild'}) ได้ทำการสังหาร **\${victimName}**\`,\n                        files: [cards.main, cards.details]`);
          s=s.replace(reDeath,`const eventPayload = { killerName, killerGuild, victimName, victimGuild, totalFame, eventTime, eventId };\n                    const cards = await buildKillDeathImages(eventPayload, true);\n\n                    await channel.send({\n                        content: \`💀 **Death Alert!** **\${victimName}** (\${victimGuild || 'No Guild'}) ได้เสียชีวิตจากการถูกสังหารโดย **\${killerName}\``,\n                        files: [cards.main, cards.details]`);
          fs.writeFileSync('index.js',s);
          NODE
          node --check index.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f killdeath_patch.txt .github/workflows/apply-killdeath.yml
          git add index.js killdeath_patch.txt .github/workflows/apply-killdeath.yml
          git commit -m "Apply AlbionKB kill/death renderer"
          git push
