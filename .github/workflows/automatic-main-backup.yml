name: Automatic backup before every main update

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  backup-previous-main:
    name: Save previous main commit
    if: github.event.before != '0000000000000000000000000000000000000000'
    runs-on: ubuntu-latest
    steps:
      - name: Create immutable backup tag for previous main through GitHub API
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ ! "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo "::notice::No valid previous main commit was supplied; nothing to back up."
            exit 0
          fi

          TAG="backup-main-before-${AFTER_SHA:0:12}"
          REF_PATH="repos/${GITHUB_REPOSITORY}/git/ref/tags/$TAG"

          # Make reruns idempotent: never overwrite an existing backup tag.
          if gh api "$REF_PATH" >/dev/null 2>&1; then
            echo "::notice::Backup tag $TAG already exists; leaving it unchanged."
            exit 0
          fi

          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/$TAG" \
            -f "sha=$BEFORE_SHA" >/dev/null

          echo "::notice::Created $TAG pointing to previous main commit $BEFORE_SHA"
