name: Automatic backup before every main update

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backup-previous-main:
    name: Archive previous main commit
    if: github.event.before != '0000000000000000000000000000000000000000'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout previous main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.before }}
          fetch-depth: 1
          persist-credentials: false

      - name: Create source archive and checksum
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail

          BACKUP_DIR="$RUNNER_TEMP/main-backup"
          mkdir -p "$BACKUP_DIR"
          ARCHIVE="$BACKUP_DIR/albion-discord-bot-main-before-$BEFORE_SHA.tar.gz"

          # Archive the exact previous main tree; exclude Git internals.
          tar --exclude='./.git' -czf "$ARCHIVE" -C "$GITHUB_WORKSPACE" .
          test -s "$ARCHIVE"

          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "main_before_sha=$BEFORE_SHA"
            echo "main_after_push_sha=$AFTER_SHA"
            echo "backup_created_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "archive_sha256=$(sha256sum "$ARCHIVE" | awk '{print $1}')"
          } > "$BACKUP_DIR/manifest.txt"

          cat "$BACKUP_DIR/manifest.txt"

      - name: Upload automatic backup artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: main-backup-before-${{ github.event.after }}
          path: ${{ runner.temp }}/main-backup/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
