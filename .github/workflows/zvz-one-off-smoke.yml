# Validation attempt for PR #48 on 2026-11-21; one Asia list, one detail, one Official check.
name: One-time AlbionZvZ Asia API smoke check (temporary)
on:
  pull_request:
    paths:
      - .github/workflows/zvz-one-off-smoke.yml
permissions:
  contents: read
jobs:
  inspect-public-api:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Probe one Asia list, one matching detail, one Official detail
        run: |
          node <<'NODE'
          'use strict';
          const {parseDetail} = require('./albionzvz-source');
          const now = Date.now();
          const to = new Date(now).toISOString().slice(0, 10);
          const from = new Date(now - 86400000).toISOString().slice(0, 10);
          async function getJson(label, url) {
            const response = await fetch(url, {
              signal: AbortSignal.timeout(8000),
              redirect: 'manual',
              headers: { 'Accept': 'application/json', 'User-Agent': 'BossBot-OneTimeValidation/1.0' },
            });
            console.log(label, 'HTTP', response.status, 'Content-Type', response.headers.get('content-type') || 'none',
              'Retry-After', response.headers.get('retry-after') || 'none');
            if ([401, 403, 429].includes(response.status)) {
              throw Error(label + ' denied or rate-limited; stop with no retries');
            }
            if (!response.ok) throw Error(label + ' returned HTTP ' + response.status);
            const value = await response.text();
            if (value.length > 3000000) throw Error(label + ' response too large');
            return JSON.parse(value);
          }
          (async () => {
            const url = new URL('https://www.albionzvz.com/api/battles');
            for (const [k, v] of Object.entries({server:'asia',from,to,minMass:'10',massMode:'total',offset:'0',limit:'2'}))
              url.searchParams.set(k, v);
            const list = await getJson('AlbionZvZ Asia List', url);
            if (!Array.isArray(list.rows) || !list.rows.length) throw Error('No Asia rows returned; cannot validate');
            const row = list.rows[0];
            const id = String(row.id ?? row.battleId ?? '');
            if (!/^\d{6,20}$/.test(id)) throw Error('Unrecognized list Battle ID');
            console.log('List schema:', Object.keys(list).sort().join(','),
              'Rows:', list.rows.length, 'First row keys:', Object.keys(row).sort().join(','));
            const zvzDetailUrl = new URL('https://www.albionzvz.com/api/dev/battle-board/battle');
            zvzDetailUrl.searchParams.set('battleId', id);
            zvzDetailUrl.searchParams.set('server','asia');
            const detail = await getJson('AlbionZvZ Asia Detail', zvzDetailUrl);
            const battle = detail.battle ?? {};
            const players = battle.players ? Object.values(battle.players) : [];
            const guilds = battle.guilds ? Object.values(battle.guilds) : [];
            console.log('Detail schema:',Object.keys(detail).sort().join(','),
              'Battle fields:',Object.keys(battle).sort().join(','),
              'Players:',players.length,'Guilds:',guilds.length);
            if (String(battle.id ?? battle.battleId) !== id || (detail.server && detail.server !== 'asia'))
              throw Error('AlbionZvZ detail ID/region mismatch');
            const official = await getJson('Official Asia Detail','https://gameinfo-sgp.albiononline.com/api/gameinfo/battles/'+id);
            const oplayers = official.players ? Object.values(official.players) : [];
            const oguilds = official.guilds ? Object.values(official.guilds) : [];
            console.log('Same ID:',String(official.id)===id,'Players:',players.length,'Official:',oplayers.length,
              'Guilds:',guilds.length,'Official:',oguilds.length,
              'Total fame:',battle.totalFame,'Official:',official.totalFame,
              'Total kills:',battle.totalKills,'Official:',official.totalKills,
              'Start:',battle.startTime,'Official:',official.startTime,
              'End:',battle.endTime,'Official:',official.endTime);
            console.log('Sample player keys:',players.length?Object.keys(players[0]).sort().join(','):'none',
              'Sample guild keys:',guilds.length?Object.keys(guilds[0]).sort().join(','):'none',
              'Sample guildMass fields:',row.guildMasses?.[0]?Object.keys(row.guildMasses[0]).sort().join(','):'none');
            if (String(official.id) !== id) throw Error('Official returned a different ID');
            const g = row.guildMasses?.find(x => x?.guildId && x?.name);
            if (!g) throw Error('List lacks a verifiable guild identity');
            const normalized = parseDetail(detail,id,row,g.name,Date.now(),g.guildId);
            console.log('PRIMARY_ADAPTER_VALIDATED',Boolean(normalized),
              'Recognized guild:',g.name,'Guilds in adapter:',normalized?Object.keys(normalized.guilds).length:0,
              'Guilds in Official:',oguilds.length,
              'Sum player fame:',players.reduce((s,p)=>s+Number(p.killFame??0),0),
              'Sum player kills:',players.reduce((s,p)=>s+Number(p.kills??0),0),
              'Mass count:',row.guildMasses?.reduce((s,g)=>s+Number(g.mass??0),0));
            if (!normalized) throw Error('Adapter rejects actual AlbionZvZ battle detail - do NOT deploy');
          })().catch(err => { console.error('ONE_TIME_SMOKE_RESULT:',err.message);process.exitCode=1;});
          NODE
