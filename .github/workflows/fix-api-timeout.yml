name: Fix Albion API polling
on:
  workflow_dispatch:
  push:
    paths:
      - 'index.js'
permissions:
  contents: write
jobs:
  fix:
    if: github.actor == 'ledcbr888-code'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.js
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.js')
          s = p.read_text()
          s = s.replace("const {\n    Client,", "const {\n    Client,")
          s = s.replace("timeout: 8000, headers: { 'User-Agent': 'Mozilla/5.0', Accept: 'application/json' }", "timeout: 20000, headers: { 'User-Agent': 'Mozilla/5.0', Accept: 'application/json' }")
          s = s.replace("console.log(`⚠️ Official API skipped: ${err.message}`);", "console.warn(`⚠️ Official battle API skipped: ${err.response?.status === 404 ? 'endpoint returned 404' : err.message}`);")
          s = s.replace("ephemeral: true", "flags: 64")
          s = s.replace("client.once('ready', async () => {", "client.once('clientReady', async () => {")
          p.write_text(s)
          PY
          git diff -- index.js
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.js
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'Harden Albion API polling and Discord interaction flags'
            git push
          fi
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/fix-api-timeout.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/fix-api-timeout.yml || true
          if ! git diff --cached --quiet; then
            git commit -m 'Remove temporary API fix workflow'
            git push
          fi