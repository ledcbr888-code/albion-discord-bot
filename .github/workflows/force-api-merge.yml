name: Force API Battle Merge

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply battle data fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.js')
          s = p.read_text(encoding='utf-8')

          # Always fetch the official Albion battle API. AlbionBB HTML can be a partial
          # render; using the API only when playerMap is empty loses players/deaths.
          s = s.replace('if (playerMap.size === 0 && /^\\\\d+$/.test(matchId)) {', 'if (/^\\\\d+$/.test(matchId)) {')
          s = s.replace('if (playerMap.size === 0 && /^\\d+$/.test(matchId)) {', 'if (/^\\d+$/.test(matchId)) {')

          # Never add duplicate HTML/Next.js/API representations of one player.
          s = s.replace('existing.kills += p.kills;', 'existing.kills = Math.max(Number(existing.kills) || 0, Number(p.kills) || 0);')
          s = s.replace('existing.deaths += p.deaths;', 'existing.deaths = Math.max(Number(existing.deaths) || 0, Number(p.deaths) || 0);')
          s = s.replace('existing.fame += p.fame;', 'existing.fame = Math.max(Number(existing.fame) || 0, Number(p.fame) || 0);')
          s = s.replace('existing.damage += p.damage;', 'existing.damage = Math.max(Number(existing.damage) || 0, Number(p.damage) || 0);')
          s = s.replace('existing.healing += p.healing;', 'existing.healing = Math.max(Number(existing.healing) || 0, Number(p.healing) || 0);')

          # Merge official API player data even when HTML already found the player.
          old = 'if (!playerMap.has(pKey)) playerMap.set(pKey, pObj);'
          new = '''if (!playerMap.has(pKey)) {
                              playerMap.set(pKey, pObj);
                          } else {
                              const existing = playerMap.get(pKey);
                              existing.kills = Math.max(Number(existing.kills) || 0, Number(pObj.kills) || 0);
                              existing.deaths = Math.max(Number(existing.deaths) || 0, Number(pObj.deaths) || 0);
                              existing.fame = Math.max(Number(existing.fame) || 0, Number(pObj.fame) || 0);
                              existing.damage = Math.max(Number(existing.damage) || 0, Number(pObj.damage) || 0);
                              existing.healing = Math.max(Number(existing.healing) || 0, Number(pObj.healing) || 0);
                              if (pObj.guild && !existing.guild) existing.guild = pObj.guild;
                              if (pObj.weapon && isWeaponItemId(pObj.weapon)) existing.weapon = pObj.weapon;
                          }'''
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY
          node --check index.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.js
          git diff --cached --quiet || git commit -m 'fix: always merge complete official battle roster'
          git push
          git rm -f .github/workflows/force-api-merge.yml
          git commit -m 'chore: remove one-time api merge patch'
          git push