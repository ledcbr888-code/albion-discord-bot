name: Apply one-time bot stability fixes

on:
  push:
    paths:
      - '.github/workflows/one-time-stability-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch index.js
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.js')
          s = p.read_text(encoding='utf-8')
          original = s

          # discord.js v15 event name
          s = s.replace("client.once('ready', async () => {", "client.once('clientReady', async () => {")

          # Avoid overlapping background polling runs after a slow API response.
          if 'let autoBattleCheckRunning = false;' not in s:
              s = s.replace(
                  "let processedBattles = new Set(); ",
                  "let processedBattles = new Set();\nlet autoBattleCheckRunning = false;"
              )

          old_start = "async function checkAutoBattles() {\n    if (!autoBattleConfigs.length) return;\n    try {"
          new_start = "async function checkAutoBattles() {\n    if (!autoBattleConfigs.length) return;\n    if (autoBattleCheckRunning) {\n        console.warn('⚠️ Auto-Battle check skipped because the previous check is still running.');\n        return;\n    }\n\n    autoBattleCheckRunning = true;\n    try {"
          if old_start in s and "autoBattleCheckRunning = true;" not in s:
              s = s.replace(old_start, new_start, 1)

          old_end = "    } catch (err) {\n        console.error('❌ Auto-Battle background polling error:', err.message);\n    }\n}"
          new_end = "    } catch (err) {\n        console.error('❌ Auto-Battle background polling error:', err.message);\n    } finally {\n        autoBattleCheckRunning = false;\n    }\n}"
          if old_end in s and "finally {\n        autoBattleCheckRunning = false;" not in s:
              s = s.replace(old_end, new_end, 1)

          # Give the official API a little more time before falling back to the next endpoint.
          s = s.replace("timeout: 10000,\n                headers: {\n                    'User-Agent': 'Albion-Discord-Bot/1.0'", "timeout: 20000,\n                headers: {\n                    'User-Agent': 'Albion-Discord-Bot/1.0'", 1)

          # Start the first background check shortly after login instead of waiting a full 5 minutes.
          marker = "    setInterval(checkAutoBattles, 5 * 60 * 1000);"
          if marker in s and "setTimeout(checkAutoBattles, 15000);" not in s:
              s = s.replace(marker, "    setTimeout(checkAutoBattles, 15000);\n    setInterval(checkAutoBattles, 5 * 60 * 1000);", 1)

          if s == original:
              raise SystemExit('No changes were made; expected patterns were not found.')

          p.write_text(s, encoding='utf-8')

      - name: Commit patched index.js and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js .github/workflows/one-time-stability-fix.yml
          git commit -m "fix: harden Discord bot background polling"
          git rm .github/workflows/one-time-stability-fix.yml
          git commit -m "chore: remove one-time stability patch workflow"
          git push
