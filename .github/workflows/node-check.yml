name: Node syntax check

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check index.js syntax
        run: node --check index.js
      - name: Test resumable Battleboard delta cursor
        run: node --test test/battleboard-delta-cursor.test.js
