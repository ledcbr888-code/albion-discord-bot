name: Bot integration checks

on:
  pull_request:
    paths:
      - 'index.js'
      - 'cta.js'
      - 'battleboard-integration.js'
      - 'backup-traffic-policy.js'
      - 'reported-battles-store.js'
      - 'migrations/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/battleboard-integration.yml'
  push:
    branches:
      - main
    paths:
      - 'index.js'
      - 'cta.js'
      - 'battleboard-integration.js'
      - 'backup-traffic-policy.js'
      - 'reported-battles-store.js'
      - 'migrations/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/battleboard-integration.yml'

jobs:
  node-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Install exact audited Bot dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          node --check index.js
          node --check battleboard-integration.js
          node --check backup-traffic-policy.js
          node --check reported-battles-store.js
          node --check test/backup-bandwidth.test.js
          node --check cta.js
          node --check test/battleboard-integration.test.js
          node --check test/cta.test.js
      - name: Run isolated integration tests
        run: node --test test/*.test.js
