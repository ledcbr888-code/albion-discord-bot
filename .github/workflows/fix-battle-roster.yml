name: Fix Battle Roster

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch battle parser
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.js')
          s = p.read_text(encoding='utf-8')

          start = s.index('function parseDataFromHTML(html) {')
          end = s.index('\nfunction parseNextData(html) {', start)

          new_parser = r'''function parseDataFromHTML(html) {
          const $ = cheerio.load(html);
          const players = [];
          const guilds = [];
          let battleTime = null;

          const timeText = $('time').attr('datetime') || $('time').text() || $('.battle-time').text() || '';
          if (timeText) battleTime = timeText.trim();

          const cleanHeader = value => String(value || '').replace(/\s+/g, ' ').trim().toLowerCase();
          const parseNumber = value => {
              const n = parseInt(String(value ?? '0').replace(/[^\d-]/g, ''), 10);
              return Number.isFinite(n) ? n : 0;
          };

          $('table').each((tableIndex, table) => {
              let headers = [];
              $(table).find('thead tr').first().find('th, td').each((i, cell) => headers.push(cleanHeader($(cell).text())));
              if (headers.length === 0) {
                  $(table).find('tr').first().find('th, td').each((i, cell) => headers.push(cleanHeader($(cell).text())));
              }

              const findHeader = (...names) => headers.findIndex(h => names.some(n => h === n || h.includes(n)));
              const killIndex = findHeader('kills', 'kill');
              const deathIndex = findHeader('deaths', 'death');
              const fameIndex = findHeader('kill fame', 'killfame', 'fame');
              const dmgIndex = findHeader('damage', 'dmg', 'total damage');
              const healIndex = findHeader('healing', 'heal', 'total healing');
              const nameIndex = findHeader('player name', 'player', 'name');
              const guildIndex = findHeader('guild name', 'guild');

              if (killIndex < 0 || deathIndex < 0 || nameIndex < 0) return;

              $(table).find('tbody tr, tr').each((i, row) => {
                  const cells = [];
                  $(row).find('td').each((j, td) => cells.push($(td).text().replace(/\s+/g, ' ').trim()));
                  if (cells.length <= Math.max(nameIndex, killIndex, deathIndex)) return;

                  const name = cells[nameIndex] || '';
                  if (!name || /^name$/i.test(name)) return;

                  const guildName = guildIndex >= 0 && guildIndex < cells.length ? cells[guildIndex] : '';
                  const kills = parseNumber(cells[killIndex]);
                  const deaths = parseNumber(cells[deathIndex]);
                  const fame = fameIndex >= 0 ? parseFameValue(cells[fameIndex]) : 0;
                  const damage = dmgIndex >= 0 ? parseFameValue(cells[dmgIndex]) : 0;
                  const healing = healIndex >= 0 ? parseFameValue(cells[healIndex]) : 0;
                  const weapon = extractMainHandFromRow($, row);

                  players.push({ name, guild: guildName, kills, deaths, fame, damage, healing, weapon });
              });
          });

          return { players, guilds, battleTime };
          }
          '''
          # Remove Python indentation introduced by the workflow YAML.
          new_parser = '\n'.join(line[10:] if line.startswith('          ') else line for line in new_parser.splitlines()) + '\n'
          s = s[:start] + new_parser + s[end:]

          old_add = '''const addOrUpdatePlayerStat = (p) => {
          const pKey = p.name.toLowerCase();
          if (!playerStatsMap[pKey]) {
          playerStatsMap[pKey] = { displayName: p.name, kills: 0, deaths: 0, fame: 0, damage: 0, healing: 0, weapon: '' };
          }
          playerStatsMap[pKey].kills += p.kills;
          playerStatsMap[pKey].deaths += p.deaths;
          playerStatsMap[pKey].fame += p.fame;
          playerStatsMap[pKey].damage += p.damage;
          playerStatsMap[pKey].healing += p.healing;
          if (p.weapon && isWeaponItemId(p.weapon)) {
          playerStatsMap[pKey].weapon = normalizeAlbionItemId(p.weapon);
          }
          foundAnyData = true;
          };'''
          new_add = '''const addOrUpdatePlayerStat = (p) => {
          if (!p || !p.name) return;
          const pKey = p.name.toLowerCase();
          if (!playerStatsMap[pKey]) {
          playerStatsMap[pKey] = { displayName: p.name, guild: p.guild || '', kills: 0, deaths: 0, fame: 0, damage: 0, healing: 0, weapon: '' };
          }
          const current = playerStatsMap[pKey];
          current.kills = Math.max(Number(current.kills) || 0, Number(p.kills) || 0);
          current.deaths = Math.max(Number(current.deaths) || 0, Number(p.deaths) || 0);
          current.fame = Math.max(Number(current.fame) || 0, Number(p.fame) || 0);
          current.damage = Math.max(Number(current.damage) || 0, Number(p.damage) || 0);
          current.healing = Math.max(Number(current.healing) || 0, Number(p.healing) || 0);
          if (p.guild && !current.guild) current.guild = p.guild;
          if (p.weapon && isWeaponItemId(p.weapon)) current.weapon = normalizeAlbionItemId(p.weapon);
          foundAnyData = true;
          };'''
          if old_add not in s:
              raise SystemExit('addOrUpdatePlayerStat block not found')
          s = s.replace(old_add, new_add, 1)

          # Always query the official Albion battle API. Previously it was only used
          # when AlbionBB returned zero data, so a partial HTML scrape prevented the
          # missing players/deaths from ever being recovered.
          s = s.replace("if (!foundAnyData && /^\\d+$/.test(matchId)) {", "if (/^\\d+$/.test(matchId)) {", 1)

          # Do not double-count guild totals from HTML + __NEXT_DATA__ + API.
          # Rebuild guild totals once from the deduplicated player map.
          marker = "const formattedBattleTime = formatUTCTime(rawBattleTime);"
          insert = '''// Rebuild tracked guild totals from deduplicated player stats so the
          // same battle is never counted twice when HTML, Next.js and Official API overlap.
          for (const g of targetGuilds) {
          const gKey = g.toLowerCase();
          const total = { kills: 0, deaths: 0, fame: 0 };
          for (const player of Object.values(playerStatsMap)) {
          if (player.guild && player.guild.toLowerCase() === gKey) {
          total.kills += Number(player.kills) || 0;
          total.deaths += Number(player.deaths) || 0;
          total.fame += Number(player.fame) || 0;
          }
          }
          if (guildStatsMap[gKey]) {
          guildStatsMap[gKey].kills = total.kills;
          guildStatsMap[gKey].deaths = total.deaths;
          guildStatsMap[gKey].fame = total.fame;
          }
          }

          ''' + marker
          if marker not in s:
              raise SystemExit('report marker not found')
          s = s.replace(marker, insert, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Syntax check
        run: node --check index.js

      - name: Commit only index.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js
          git diff --cached --quiet || git commit -m "fix: recover missing battle players and deaths"
          git push

      - name: Remove patch workflow
        if: success()
        run: |
          git rm -f .github/workflows/fix-battle-roster.yml
          git commit -m "chore: remove one-time battle roster patch workflow" || true
          git push || true