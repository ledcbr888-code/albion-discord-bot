name: Fix Missing Battle Players

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch index.js
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.js')
          s = p.read_text(encoding='utf-8')

          old = r"if (playerMap.size === 0 && /^\\d\+\$/.test(matchId)) {"
          if old in s:
              s = s.replace(old, "if (/^\\d+$/.test(matchId)) {", 1)
          else:
              # Exact source uses a normal JS regex literal.
              s = s.replace("if (playerMap.size === 0 && /^\\d+$/.test(matchId)) {", "if (/^\\d+$/.test(matchId)) {", 1)

          # HTML and Next.js can describe the same player. Never add those
          # duplicate records together; keep the highest value seen for each stat.
          s = s.replace("existing.kills += p.kills;", "existing.kills = Math.max(Number(existing.kills) || 0, Number(p.kills) || 0);")
          s = s.replace("existing.deaths += p.deaths;", "existing.deaths = Math.max(Number(existing.deaths) || 0, Number(p.deaths) || 0);")
          s = s.replace("existing.fame += p.fame;", "existing.fame = Math.max(Number(existing.fame) || 0, Number(p.fame) || 0);")
          s = s.replace("existing.damage += p.damage;", "existing.damage = Math.max(Number(existing.damage) || 0, Number(p.damage) || 0);")
          s = s.replace("existing.healing += p.healing;", "existing.healing = Math.max(Number(existing.healing) || 0, Number(p.healing) || 0);")

          old_api = """if (!playerMap.has(pKey)) playerMap.set(pKey, pObj);"""
          new_api = """if (!playerMap.has(pKey)) {
                              playerMap.set(pKey, pObj);
                          } else {
                              const existing = playerMap.get(pKey);
                              existing.kills = Math.max(Number(existing.kills) || 0, Number(pObj.kills) || 0);
                              existing.deaths = Math.max(Number(existing.deaths) || 0, Number(pObj.deaths) || 0);
                              existing.fame = Math.max(Number(existing.fame) || 0, Number(pObj.fame) || 0);
                              existing.damage = Math.max(Number(existing.damage) || 0, Number(pObj.damage) || 0);
                              existing.healing = Math.max(Number(existing.healing) || 0, Number(pObj.healing) || 0);
                              if (pObj.guild && !existing.guild) existing.guild = pObj.guild;
                              if (pObj.weapon && isWeaponItemId(pObj.weapon)) existing.weapon = pObj.weapon;
                          }"""
          if old_api not in s:
              raise SystemExit('Official API player merge marker not found')
          s = s.replace(old_api, new_api, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate syntax
        run: node --check index.js

      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js
          git diff --cached --quiet || git commit -m "fix: always merge complete official battle roster"
          git push
          git rm -f .github/workflows/fix-missing-battle-players.yml
          git commit -m "chore: remove one-time battle roster patch"
          git push